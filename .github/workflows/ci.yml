name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt

      - name: Run Flask tests
        working-directory: app
        run: pytest -q

      - name: Validate Python syntax
        run: python -m py_compile app/app.py app/test_app.py

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool grafana/dashboards/devops-observability.json > /tmp/devops-observability.json

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Validate production Docker Compose config
        run: GRAFANA_ADMIN_PASSWORD=ci-test-password docker compose -f docker-compose.yml -f docker-compose.prod.yml config

      - name: Build Flask Docker image
        run: docker build -t observability-platform-flask-app:ci ./app
